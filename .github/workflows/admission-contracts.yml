name: Admission statistical contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/admission/**"
      - "tests/phase-07/worker-benchmark.test.ts"
      - "tests/phase-07/admission-slo.test.ts"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/admission-contracts.yml"

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test tests/phase-07/worker-benchmark.test.ts tests/phase-07/admission-slo.test.ts --timeout 10000
