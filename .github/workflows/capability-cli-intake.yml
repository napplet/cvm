name: Capability CLI source intake
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/rebuild-napplet-cli-source.ts"
      - "scripts/verify-capability-cli-source-build.ts"
      - "toolchains/recipes/napplet-cli-0.13.0-capabilities-source-build.json"
      - "toolchains/locks/capabilities-cli/**"
      - "tests/runner/cli-source-build-profiles.test.ts"
      - "tests/runner/capability-cli-intake.test.ts"
      - ".github/workflows/capability-cli-intake.yml"
permissions:
  contents: read
jobs:
  intake:
    name: Rebuild capability CLI on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - run: bun install --frozen-lockfile
      - name: Verify separate profiles and immutable intake inputs
        run: |
          bun test tests/runner/cli-source-build-profiles.test.ts tests/runner/capability-cli-intake.test.ts tests/runner/source-build-candidate.test.ts --timeout 10000
          bun scripts/verify-capability-cli-source-build.ts
          bun scripts/verify-napplet-cli-source-build.ts
      - name: Build each architecture twice and verify original source plus reviewed overlay
        env:
          NAPPLET_CLI_INTAKE_ROOT: ${{ runner.temp }}/capability-cli-source
        run: |
          bun scripts/rebuild-napplet-cli-source.ts --profile capabilities-0.13.0 --output "$NAPPLET_CLI_INTAKE_ROOT"
          bun scripts/verify-capability-cli-source-build.ts --receipt "$NAPPLET_CLI_INTAKE_ROOT/receipt.json"
      - name: Retain source intake receipt, logs and measured executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-cli-source-intake
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/capability-cli-source/receipt.json
            ${{ runner.temp }}/capability-cli-source/*/seed.log
            ${{ runner.temp }}/capability-cli-source/*/build.log
            ${{ runner.temp }}/capability-cli-source/*-one/artifact/napplet
