name: Core value contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/dev-ui/development-progress.ts"
      - "src/dev-ui/browser/contextvm-client.ts"
      - "src/dev-ui/browser/product-workspace.ts"
      - "src/dev-ui/contextvm-server.ts"
      - "src/contextvm/adapter.ts"
      - "tests/dev-ui/development-progress.test.ts"
      - "src/dev/local-generation-adapters.ts"
      - "tests/dev/local-proposal-ownership.test.ts"
      - "src/phase-02/trusted-core.ts"
      - "src/phase-04/napplet-harness.ts"
      - "src/worker-port/fake-worker.ts"
      - "infra/toolchain/fixture-runner.ts"
      - "src/certification/adapters.ts"
      - "src/certification/runner.ts"
      - "src/certification/supply-chain.ts"
      - "src/dev-ui/preview-server.ts"
      - "src/dev/dev-funding-reconciler.ts"
      - "src/persistence/funding-store.ts"
      - "tests/persistence/continuation-store.test.ts"
      - "tests/phase-05/**"
      - "src/persistence/sqlite-session-store.ts"
      - "src/runner/hermetic-command.ts"
      - "src/verification/phase-06-reference-set.ts"
      - "tests/evals/phase-04-reference-set.test.ts"
      - "tests/billing/price-card.test.ts"
      - "tests/evals/phase-05-reference-set.test.ts"
      - "tests/evals/phase-06-reference-set.test.ts"
      - "src/verification/design-evidence.ts"
      - "src/verification/phase-02-design-evidence.ts"
      - "tests/capabilities/**"
      - "tests/phase-02/**"
      - "tests/phase-04/**"
      - "tests/phase-07/supply-chain.test.ts"
      - "tests/phase-07/certification-runner.test.ts"
      - "tests/phase-07/promotion-gate.test.ts"
      - "tests/persistence/sqlite-session-store.test.ts"
      - "tests/evidence/**"
      - "tests/verification/phase-03-design-slice.test.ts"
      - "tests/verification/design-evidence.test.ts"
      - "tests/verification/phase-02-design-slice.test.ts"
      - "tests/runner/hermetic-command.test.ts"
      - "tests/dev-ui/preview-server.boundaries.test.ts"
      - "tests/dev-ui/homelab-preview.test.ts"
      - "tests/fixtures/unexecuted-protected-ports.ts"
      - "tests/release/certify-live-composition.test.ts"
      - "tests/release/deployment-protected-ports.test.ts"
      - "tests/release/gcp-cost-estimator.test.ts"
      - "tests/release/live-cost-estimator.test.ts"
      - "tests/release/live-production-composition.test.ts"
      - "tests/release/model-live-provider.test.ts"
      - "tests/release/native-discovery.test.ts"
      - "tests/release/production-dependencies.test.ts"
      - "tests/release/production-readiness.test.ts"
      - "tests/release/release-authorization-costs.test.ts"
      - "tests/worker-port/**"
      - ".github/workflows/core-value-contracts.yml"
permissions:
  contents: read
jobs:
  core-values:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
      NAPPLET_CVM_WORKER_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd tests/dev-ui --frozen-lockfile
      - name: Install pinned Chromium and Linux browser libraries
        run: bun tests/dev-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Byte ownership, transaction results and preserved evidence contracts
        run: bun test tests/release/certify-live-composition.test.ts tests/release/deployment-protected-ports.test.ts tests/release/gcp-cost-estimator.test.ts tests/release/live-cost-estimator.test.ts tests/release/live-production-composition.test.ts tests/release/model-live-provider.test.ts tests/release/native-discovery.test.ts tests/release/production-dependencies.test.ts tests/release/production-readiness.test.ts tests/release/release-authorization-costs.test.ts tests/evals/phase-05-reference-set.test.ts tests/evals/phase-06-reference-set.test.ts tests/dev-ui/development-progress.test.ts tests/contextvm tests/dev/local-proposal-ownership.test.ts tests/capabilities tests/phase-02 tests/phase-04 tests/phase-07/supply-chain.test.ts tests/phase-07/certification-runner.test.ts tests/phase-07/promotion-gate.test.ts tests/persistence/sqlite-session-store.test.ts tests/verification/design-evidence.test.ts tests/verification/phase-02-design-slice.test.ts tests/runner/hermetic-command.test.ts tests/dev-ui/preview-server.boundaries.test.ts tests/dev-ui/homelab-preview.test.ts tests/worker-port tests/evidence/bundle.test.ts tests/verification/phase-03-design-slice.test.ts tests/evals/phase-04-reference-set.test.ts tests/billing/price-card.test.ts tests/phase-05 tests/persistence/continuation-store.test.ts --timeout 10000
