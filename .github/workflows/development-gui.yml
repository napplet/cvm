name: Development GUI e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/model/**"
      - "src/dev/**"
      - "src/dev-ui/**"
      - "src/contextvm/**"
      - "src/continuity/**"
      - "src/phase-04/**"
      - "src/persistence/**"
      - "infra/dev-ui/**"
      - "infra/dev-payments/**"
      - "migrations/**"
      - "scripts/dev*.ts"
      - "scripts/probe-development-relay.ts"
      - "tests/fixtures/chatgpt.ts"
      - "tests/dev/**"
      - "tests/dev-ui/**"
      - ".github/workflows/development-gui.yml"

permissions:
  contents: read

jobs:
  gui:
    # Both the worker image and pinned relay run natively on this AMD64 runner.
    runs-on: ubuntu-24.04
    env:
      NAPPLET_CVM_WORKER_PLATFORM: linux/amd64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install the Compose version required by the worker image contract
        uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        with:
          version: v2.39.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd tests/dev-ui --frozen-lockfile
      - name: Install host Chromium and its Linux libraries
        run: bun tests/dev-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify the pinned native AMD64 development relay
        run: bun scripts/probe-development-relay.ts
      - run: bun scripts/dev.ts up
      - run: bun scripts/dev.ts status
      - name: Real development service and browser flows
        run: bun scripts/dev.ts test --case=full
      - name: Isolated launcher persistence and reset
        run: bun run tests/dev-ui/launcher.e2e.ts --case=clean-up-idempotent-down-persist-reset
      - name: Service remains reachable after idle and garbage collection
        run: bun run tests/dev-ui/contextvm-server-liveness.e2e.ts
      - name: Isolated tests preserve the primary workspace readiness
        run: bun scripts/dev.ts status | jq -e '.ready == true'
      - name: Retain bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-gui-evidence
          path: .local/development-gui-evidence/full-flow-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove only this job's development state
        if: always()
        run: bun scripts/dev.ts reset --confirm
