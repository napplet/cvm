name: Development payment e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/dev-payments/**"
      - "scripts/dev-payments.ts"
      - "tests/dev/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/development-payments.yml"

permissions:
  contents: read

jobs:
  payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/dev-payments.ts test
