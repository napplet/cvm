name: Development payment e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/dev-payments/**"
      - "infra/dev-ui/**"
      - "infra/dev-publication/**"
      - "scripts/dev-*.ts"
      - "src/funding/**"
      - "src/persistence/**"
      - "src/domain/**"
      - "src/phase-03/**"
      - "migrations/**"
      - "tests/dev/**"
      - "tests/dev-ui/**"
      - "tests/funding/**"
      - "package.json"
      - "bun.lock"
      - "scripts/probe-development-relay.ts"
      - ".github/workflows/development-payments.yml"

permissions:
  contents: read

jobs:
  payments:
    runs-on: ubuntu-24.04
    env:
      NAPPLET_CVM_WORKER_PLATFORM: linux/amd64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install the Compose version required by the worker image contract
        uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        with:
          version: v2.39.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd tests/dev-ui --frozen-lockfile
      - name: Install host Chromium and its Linux libraries
        run: bun tests/dev-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify the pinned native AMD64 development relay
        run: bun scripts/probe-development-relay.ts
      - name: Prove PostgreSQL production accounting isolation
        run: NAPPLET_RUN_POSTGRES_ISOLATION=1 bun test tests/funding/production-accounting-realm.test.ts --timeout 120000
      - run: bun scripts/dev-payments.ts test
