name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'examples/contextvm/**', 'src/**', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['docs/**', 'examples/contextvm/**', 'src/**', '.github/workflows/documentation.yml', '.github/ISSUE_TEMPLATE/schema-amendment.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun install --cwd docs --frozen-lockfile
      - run: bun docs/scripts/export-contracts.ts --check
      - run: bun test examples/contextvm/mcp-compatibility.test.ts
      - run: bun run --cwd docs build
      - run: bun run --cwd docs check:links
      - name: Package the required URL prefix
        run: |
          mkdir -p .local/docs-site/docs
          cp -R docs/.vitepress/dist/. .local/docs-site/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: .local/docs-site/
          include-hidden-files: true
