name: Production certification transport
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/contextvm/**"
      - "src/release/deployment/contextvm-client.ts"
      - "src/release/deployment/production-core-suite-*.ts"
      - "src/production/certification-services.ts"
      - "src/production/worker-capacity.ts"
      - "src/production/unused-admission.ts"
      - "tests/release/contextvm-certification-client.integration.test.ts"
      - "tests/release/helpers/contextvm-certification-fixture.ts"
      - "tests/release/production-core-suites.test.ts"
      - ".github/workflows/production-certification-transport.yml"
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_RUN_POSTGRES_ISOLATION: "1"
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Signed TLS relay and durable original-operation recovery
        run: bun test tests/release/contextvm-certification-client.integration.test.ts tests/release/production-core-suites.test.ts --timeout 60000
