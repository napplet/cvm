      - "tests/release/production-core-suites.test.ts"
      - ".github/workflows/production-certification-transport.yml"
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_RUN_POSTGRES_ISOLATION: "1"
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Signed TLS relay and durable original-operation recovery
        run: bun test tests/persistence/continuation-store.test.ts tests/production/account-owner-postgres.test.ts tests/contextvm/adapter.test.ts tests/production/contextvm-generation-intake-postgres.test.ts tests/model/retained-generation-command.test.ts tests/release/vertex-creation-budget.test.ts tests/release/vertex-recovery-progress-postgres.test.ts tests/release/vertex-current-wire.test.ts tests/production/checkpoint-retention-postgres.test.ts tests/phase-04/revision.test.ts tests/production/original-model-recovery-postgres.test.ts tests/production/initial-pending-checkpoint-postgres.test.ts tests/production/protected-command.test.ts tests/production/resumed-generation-postgres.test.ts tests/production/session-cap-postgres.test.ts tests/production/model-composition-postgres.test.ts tests/release/contextvm-certification-client.integration.test.ts tests/release/production-core-suites.test.ts tests/production/worker-lifecycle-postgres.test.ts tests/production/service-journals-postgres.test.ts tests/production/worker-job-router.test.ts tests/production/funded-generation-postgres.test.ts tests/production/checkpoint-postgres.test.ts tests/production/gcs-generation-recovery.test.ts tests/production/resume-retry-postgres.test.ts tests/phase-05/resume-session.test.ts tests/phase-05/checkpoint-envelope.test.ts tests/release/postgres-operation-journal.test.ts tests/production/worker-bridge.test.ts tests/release/production-edge-suites.test.ts tests/production/certification-ingress.test.ts tests/production/normal-production-composition.test.ts --timeout 150000
