name: Production collector
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/production/collector-wire.ts"
      - "infra/otel/collector.yaml"
      - "infra/production/collector.Dockerfile"
      - "src/telemetry/**"
      - "tests/production/collector-wire.integration.test.ts"
      - ".github/workflows/production-collector.yml"
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
      NAPPLET_RUN_COLLECTOR_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Actual pinned collector export and policy boundary
        run: bun test tests/production/collector-wire.integration.test.ts --timeout 120000
