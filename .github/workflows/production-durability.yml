name: Production durability foundation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "vendor/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "infra/production/Dockerfile"
      - "infra/production/modal-billing/**"
      - "scripts/production.ts"
      - "scripts/test-production-control-image.ts"
      - "tests/fixtures/legacy-durability-subjects.sql"
      - "tests/fixtures/scripted-sql-pool.ts"
      - "tests/production/durability-registry*.test.ts"
      - "tests/production/checkpoint-postgres.test.ts"
      - "tests/production/retained-subjects-postgres.test.ts"
      - "tests/production/resume-pricing-preparer-postgres.test.ts"
      - "tests/dev-ui/package.json"
      - "tests/dev-ui/bun.lock"
      - ".github/workflows/production-durability.yml"
permissions:
  contents: read
jobs:
  postgres-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
      NAPPLET_RUN_POSTGRES_ISOLATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd tests/dev-ui --frozen-lockfile
      - name: Whole project with the pinned compiler
        run: bunx --package typescript@5.9.3 tsc --noEmit --pretty false
      - name: Canonical SQL, receipt-bound retained-subject preparation, fresh recovery and priced continuation preservation
        run: bun test tests/production/durability-registry.test.ts tests/production/durability-registry-postgres.test.ts tests/production/retained-subjects-postgres.test.ts tests/production/resume-pricing-preparer-postgres.test.ts tests/production/checkpoint-postgres.test.ts --timeout 120000
      - name: Build the unselected control image
        run: docker build -f infra/production/Dockerfile -t cvm-control-proof:ci .
      - name: Exact image packaging and fail-closed boot without authority
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' cvm-control-proof:ci)"
          bun scripts/test-production-control-image.ts "$image_id"
      - name: Build the unselected LinuxAMD64 Modal report control target
        run: docker build --platform linux/amd64 --target modal-billing -f infra/production/Dockerfile -t cvm-modal-control-proof:ci .
      - name: Offline pinned Modal executable, closure and fail-closed control composition
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' cvm-modal-control-proof:ci)"
          bun scripts/test-production-control-image.ts "$image_id" --modal-billing
