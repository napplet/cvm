name: Production finalization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/release/finaliz*.ts"
      - "src/release/verify-finalization.ts"
      - "src/production/release-promotion.ts"
      - "src/release/materialize-certifier.ts"
      - "src/certification/**"
      - "src/promotion/**"
      - "scripts/certify-release.ts"
      - "tests/release/finalized-bundle.test.ts"
      - "tests/release/helpers/finalization-fixtures.ts"
      - "tests/release/materialize-certifier.test.ts"
      - "tests/release/postgres-operation-journal.test.ts"
      - ".github/workflows/production-finalization.yml"
permissions:
  contents: read
jobs:
  finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Finalizer output, independent authority and original-operation recovery
        run: bun test tests/release/finalized-bundle.test.ts tests/release/materialize-certifier.test.ts tests/release/live-controller.test.ts tests/release/deployment-forced-resume.test.ts tests/release/certify-release.test.ts --timeout 15000
      - name: Restricted PostgreSQL atomic pointer and lost commit recovery
        run: NAPPLET_RUN_POSTGRES_ISOLATION=1 bun test tests/release/postgres-operation-journal.test.ts --timeout 120000
