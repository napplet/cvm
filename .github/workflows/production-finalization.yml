name: Production finalization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/release/finaliz*.ts"
      - "src/release/verify-finalization.ts"
      - "src/production/worker-artifact-store.ts"
      - "src/production/worker-bridge.ts"
      - "tests/production/worker-bridge.test.ts"
      - "src/production/release-promotion.ts"
      - "src/production/release-cleanup.ts"
      - "src/production/mounted-session-material.ts"
      - "src/production/mounted-google-controls.ts"
      - "src/release/native/**"
      - "tests/release/cloud-run-provider.test.ts"
      - "tests/release/cloud-sql-provider.test.ts"
      - "tests/release/collector-provider.test.ts"
      - "tests/release/production-execution.test.ts"
      - "tests/release/production-factory.test.ts"
      - "tests/release/host-signer-live-provider.test.ts"
      - "tests/release/gcs-provider.test.ts"
      - "tests/phase-07/restore-drill.test.ts"
      - "tests/production/release-cleanup.test.ts"
      - "src/production/release-verification-authority.ts"
      - "src/release/materialize-certifier.ts"
      - "src/certification/**"
      - "src/promotion/**"
      - "src/resilience/fault-harness.ts"
      - "tests/release/live-operations-adapters.test.ts"
      - "tests/release/worker-selection-freshness.test.ts"
      - "tests/phase-07/fault-matrix.test.ts"
      - "scripts/certify-release.ts"
      - "tests/release/finalized-bundle.test.ts"
      - "tests/release/helpers/finalization-fixtures.ts"
      - "tests/release/materialize-certifier.test.ts"
      - "tests/release/postgres-operation-journal.test.ts"
      - ".github/workflows/production-finalization.yml"
permissions:
  contents: read
jobs:
  finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Finalizer output, independent authority and original-operation recovery
        run: bun test tests/production/release-cleanup.test.ts tests/release/finalized-bundle.test.ts tests/release/materialize-certifier.test.ts tests/release/live-controller.test.ts tests/release/deployment-forced-resume.test.ts tests/release/certify-release.test.ts --timeout 15000
      - name: Native owned cleanup and mounted composition
        run: bun test tests/release/cloud-run-provider.test.ts tests/release/cloud-sql-provider.test.ts tests/release/collector-provider.test.ts tests/production/mounted-session-material.test.ts tests/release/production-execution.test.ts tests/release/production-factory.test.ts tests/release/host-signer-live-provider.test.ts tests/release/gcs-provider.test.ts tests/phase-07/restore-drill.test.ts
      - name: Restricted PostgreSQL atomic pointer and lost commit recovery
        run: NAPPLET_RUN_POSTGRES_ISOLATION=1 bun test tests/release/postgres-operation-journal.test.ts tests/production/worker-bridge.test.ts --timeout 120000
      - name: Independent original-operation fault oracle
        run: bun test tests/release/live-operations-adapters.test.ts tests/phase-07/fault-matrix.test.ts
      - name: Worker selection evidence freshness
        run: bun test tests/release/worker-selection-freshness.test.ts tests/release/modal-live-provider.test.ts tests/release/fly-live-provider.test.ts
