name: Production pricing and model receipts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/production/funded-replay-authority.ts"
      - "tests/fixtures/funded-replay-authority.ts"
      - "src/contextvm/adapter.ts"
      - "tests/contextvm/adapter.test.ts"
      - "src/production/contextvm-generation-intake.ts"
      - "tests/production/contextvm-generation-intake-postgres.test.ts"
      - "src/release/deployment/contextvm-client.ts"
      - "src/release/deployment/postgres-operation-journal.ts"
      - "src/funding/funding-service.ts"
      - "src/persistence/postgres-funding-store.ts"
      - "src/release/deployment/production-funding.ts"
      - "src/production/account-owner.ts"
      - "migrations/phase-07/008_production_account_owners.sql"
      - "tests/production/account-owner-postgres.test.ts"
      - "tests/production/model-composition-postgres.test.ts"
      - "src/release/deployment/google-auth.ts"
      - "src/release/deployment/google-clients.ts"
      - "src/release/deployment/cloud-run-resource-profile.ts"
      - "tests/release/cloud-run-memory-pricing.test.ts"
      - "tests/release/google-production-transport.test.ts"
      - "tests/release/deployment-google-clients.test.ts"
      - "src/model/retained-generation-command.ts"
      - "src/production/generation-recovery.ts"
      - "src/production/generation-runtime.ts"
      - "src/persistence/funding-store.ts"
      - "src/persistence/postgres-sql-funding-store.ts"
      - "src/phase-04/metered-generation-service.ts"
      - "migrations/phase-07/007_production_generation_recovery.sql"
      - "tests/model/retained-generation-command.test.ts"
      - "src/release/costs/**"
      - "src/release/deployment/vertex-client.ts"
      - "src/release/deployment/openai-responses-client.ts"
      - "src/release/deployment/postgres-openai-responses-journal.ts"
      - "src/production/openai-responses-model-gateway.ts"
      - "tests/release/vertex-creation-budget.test.ts"
      - "tests/fixtures/model/delayed-response.ts"
      - "src/release/deployment/vertex-recovery-scan.ts"
      - "src/release/deployment/postgres-provider-journals.ts"
      - "tests/release/vertex-recovery-progress-postgres.test.ts"
      - "src/release/deployment/vertex-interaction-wire.ts"
      - "tests/release/vertex-current-wire.test.ts"
      - "tests/fixtures/model/legacy-vertex-original.json"
      - "src/release/topology.ts"
      - "src/model/price-card.ts"
      - "tests/release/production-pricing-model.test.ts"
      - "tests/release/non-google-model-costs.test.ts"
      - "tests/release/official-adc-process.test.ts"
      - "tests/release/production-catalog.test.ts"
      - "tests/release/authorization.test.ts"
      - "tests/release/production-preapproval.test.ts"
      - ".github/workflows/production-pricing.yml"

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Source prices, exact usage, FX and ambiguous operation contracts
        run: bun test tests/release/authorization.test.ts tests/release/deployment-google-clients.test.ts tests/release/cloud-run-memory-pricing.test.ts tests/release/google-production-transport.test.ts tests/contextvm/adapter.test.ts tests/release/vertex-creation-budget.test.ts tests/release/vertex-current-wire.test.ts tests/model tests/release/official-adc-process.test.ts tests/release/production-pricing-model.test.ts tests/release/production-catalog.test.ts tests/release/production-preapproval.test.ts tests/release/deployment-contextvm-payment-model-clients.test.ts tests/release/deployment-host-signer-clients.test.ts tests/release/deployment-publication-clients.test.ts tests/release/non-google-model-costs.test.ts --timeout 10000
