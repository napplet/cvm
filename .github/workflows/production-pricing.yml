name: Production pricing and model receipts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/release/costs/**"
      - "src/release/deployment/vertex-client.ts"
      - "src/release/topology.ts"
      - "src/model/price-card.ts"
      - "tests/release/production-pricing-model.test.ts"
      - "tests/release/official-adc-process.test.ts"
      - "tests/release/production-catalog.test.ts"
      - "tests/release/production-preapproval.test.ts"
      - ".github/workflows/production-pricing.yml"

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Source prices, exact usage, FX and ambiguous operation contracts
        run: bun test tests/model tests/release/official-adc-process.test.ts tests/release/production-pricing-model.test.ts tests/release/production-catalog.test.ts tests/release/production-preapproval.test.ts tests/release/deployment-contextvm-payment-model-clients.test.ts tests/release/deployment-host-signer-clients.test.ts tests/release/deployment-publication-clients.test.ts --timeout 10000
