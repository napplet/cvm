name: Production publication mechanisms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/production/cli-upload.ts"
      - "src/production/source-build-verifier.ts"
      - "src/production/source-build-plan.ts"
      - "src/production/artifact-verifier.ts"
      - "src/production/direct-artifact-verifier.ts"
      - "src/production/direct-html-policy.ts"
      - "src/production/sealed-worker-artifact.ts"
      - "src/worker-adapters/capability-receipt.ts"
      - "src/worker-adapters/conformance-receipt.ts"
      - "src/worker-adapters/production-job-client.ts"
      - "src/worker-adapters/publication-metadata.ts"
      - "tests/production/source-build-plan.test.ts"
      - "tests/production/artifact-verifier.test.ts"
      - "tests/production/direct-artifact-verifier.test.ts"
      - "tests/production/direct-html-policy.test.ts"
      - "tests/fixtures/direct-artifact/**"
      - "package.json"
      - "bun.lock"
      - "src/production/publication-context.ts"
      - "src/production/publication-upload.ts"
      - "src/production/publication-relays.ts"
      - "src/production/publication-operations.ts"
      - "src/production/publication-certification.ts"
      - "src/production/attestation-signer.ts"
      - "tests/production/attestation-signer.test.ts"
      - "src/production/mounted-edge-material.ts"
      - "src/production/certification-edge.ts"
      - "scripts/test-publication-context.ts"
      - "src/production/edge-contexts.ts"
      - "src/production/nip46-signer.ts"
      - "src/production/nostr-relay.ts"
      - "src/production/mounted-session-material.ts"
      - "tests/production/source-build-verifier-postgres.test.ts"
      - "tests/production/publication-context-postgres.test.ts"
      - "tests/release/production-nostr-relay.integration.test.ts"
      - "src/production/pinned-cli-network.ts"
      - "src/publication/napplet-cli-*.ts"
      - "src/release/native/upload.ts"
      - "vendor/napplet-cli-976ad054/**"
      - "scripts/rebuild-napplet-upload-helper.ts"
      - "tests/release/production-cli-upload.integration.test.ts"
      - "tests/phase-06/**"
      - ".github/workflows/production-publication.yml"

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NAPPLET_RUN_POSTGRES_ISOLATION: "1"
      NAPPLET_CVM_TEST_EXTERNAL_EFFECTS: deny
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Actual CLI function with local HTTP and restricted PostgreSQL
        run: bun test tests/release/production-cli-upload.integration.test.ts --timeout 130000
      - name: Original source evidence bytes and mutation refusal
        run: bun test tests/production/source-build-verifier-postgres.test.ts --timeout 120000
      - name: Approved publication metadata and legacy source compatibility
        run: bun test tests/production/source-build-plan.test.ts tests/production/artifact-verifier.test.ts tests/production/mounted-session-material.test.ts --timeout 10000
      - name: Direct artifact identity, parsed containment and structured receipts
        run: bun test tests/production/direct-artifact-verifier.test.ts tests/production/direct-html-policy.test.ts --timeout 10000
      - name: Derived publication contexts and original bundle recovery
        run: bun scripts/test-publication-context.ts
      - name: NIP-46 expiry and original relay operation recovery
        run: bun test tests/release/production-nostr-relay.integration.test.ts tests/release/production-edge-suites.test.ts --timeout 120000
      - name: Publication contracts and reconciliation regressions
        run: bun test tests/phase-06 tests/release/publication-live-provider.test.ts tests/production/attestation-signer.test.ts --timeout 10000
