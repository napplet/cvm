name: Production worker image validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/toolchain/**"
      - "src/release/deployment/worker-clients.ts"
      - "src/worker-adapters/**"
      - "tests/release/deployment-worker-clients.test.ts"
      - "tests/release/worker-production-transport.test.ts"
      - "scripts/test-production-worker.sh"
      - "scripts/test-production-worker.ts"
      - ".github/workflows/production-worker.yml"

permissions:
  contents: read

jobs:
  production-worker:
    name: linux/amd64 production worker
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Build production worker image
        shell: bash
        run: |
          set -euo pipefail
          timeout 30m docker build --quiet --platform linux/amd64 --target production-worker --tag napplet-cvm-production-worker:ci --file infra/toolchain/Dockerfile .
      - name: Validate local production-worker mechanism
        shell: bash
        env:
          NAPPLET_CVM_WORKER_REPORT: ${{ runner.temp }}/production-worker-report.json
        run: |
          set -euo pipefail
          timeout 12m scripts/test-production-worker.sh napplet-cvm-production-worker:ci
      - name: Focused worker transport contracts
        shell: bash
        run: bun test tests/release/deployment-worker-clients.test.ts tests/release/worker-production-transport.test.ts --timeout 10000
      - name: Upload production worker report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-worker-local-mechanism
          path: |
            ${{ runner.temp }}/production-worker-report.json
            ${{ runner.temp }}/production-worker-report.log
          if-no-files-found: warn
          retention-days: 3
