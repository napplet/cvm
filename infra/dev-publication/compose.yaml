services:
  publication-image:
    image: napplet-cvm/dev-publication:development
    build:
      context: .
      dockerfile: Dockerfile
      platforms: ["${NAPPLET_CVM_WORKER_PLATFORM:-linux/arm64}"]
      provenance: false
      sbom: false
    labels:
      com.napplet-cvm.development: "true"
      com.napplet-cvm.component: publication-image
    profiles: [build]
    entrypoint: ["/bin/true"]
