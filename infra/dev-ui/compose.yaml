services:
  worker-image:
    image: napplet-cvm/dev-worker:development
    build:
      context: .
      dockerfile: Dockerfile
      platforms: ["${NAPPLET_CVM_WORKER_PLATFORM:-linux/arm64}"]
      # Local checkpoint pins must survive a cached rebuild. Timestamped build
      # attestations change the index digest even when executable bytes match.
      provenance: false
      sbom: false
    labels:
      com.napplet-cvm.development: "true"
      com.napplet-cvm.component: worker-image
    profiles: [build]
    entrypoint: ["/bin/true"]
